<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- // daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- //tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-[#f3f4f7] flex flex-col justify-center items-center h-[100vh]">
    <!-- add background images -->
     <div class=" h-[130px] w-[300px] bg-[url(./assets/bg.png)] bg-cover flex justify-center items-center">
        <img src="assets/Group.png" alt="">

     </div>


    <form class="p-10 bg-white rounded-2xl w-[350px]">
        <label for="" class=" font-semibold">Mobile Number</label><br>

        <input id="input-mobile" type="text" placeholder="Enter Your Number" class="input mt-3 mb-5 rounded-3xl bg-[#f3f4f7]" />     <br>   
        <label for="" class="mb-5 font-semibold">4 Digit Pin</label><br>

        <input id="input-pin" type="text" placeholder="Enter 4 Digit Pin" class="input mt-3 mb-5 rounded-3xl bg-[#f3f4f7]" />   <br>
        <button id="btn-login" class="btn text-white w-full rounded-3xl bg-[#0874f2]">Login</button>
     
    </form>

<script src="script.js"></script>
</body>
</html>
